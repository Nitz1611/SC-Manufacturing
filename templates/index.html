<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manufacturing Console</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/console.css') }}" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

  <!-- ── HEADER ── -->
  <header class="app-header">
    <div class="header-brand">
      <img
        src="{{ url_for('static', filename='img/pepsico-logo.gif') }}"
        alt="PepsiCo"
        class="header-logo"
      />
      <h1 class="header-title">
        <span class="word">Manufacturing</span>
        <span class="word highlight">Console</span>
      </h1>
    </div>

    <nav class="header-nav" aria-label="Main navigation">
      <button type="button" class="nav-link" data-page="intel-brief">Intel Brief</button>
      <button type="button" class="nav-link active" data-page="kpi-overview">KPI Overview</button>
      <button type="button" class="nav-link" data-page="insights">Insights</button>
      <button type="button" class="nav-link" data-page="rca">Root Cause Analysis</button>
    </nav>

    <div class="header-profile">
      <div class="profile-avatar" title="Plant Manager">PM</div>
    </div>
  </header>

  <!-- ── FILTER SLICERS ── -->
  <div class="filter-bar" id="filter-bar" role="toolbar" aria-label="Filters"></div>

  <!-- ── MAIN CONTENT ── -->
  <main class="main-content">

    <!-- Intel Brief -->
    <section id="page-intel-brief" class="page-panel" aria-label="Intel Brief">
      <div class="page-placeholder">
        <h2>Intel Brief</h2>
        <p>Executive intelligence summary — content coming in a future requirement.</p>
      </div>
    </section>

    <!-- KPI Overview -->
    <section id="page-kpi-overview" class="page-panel active" aria-label="KPI Overview">
      <div class="kpi-tabs-bar" role="tablist" aria-label="KPI views">
        <button type="button" class="kpi-tab active" data-tab="overview" role="tab">Overview</button>
        <button type="button" class="kpi-tab" data-tab="by-category" role="tab">Unplanned DT % by Category</button>
        <button type="button" class="kpi-tab" data-tab="by-line" role="tab">Unplanned DT % by Line/Category</button>
        <button type="button" class="kpi-tab" data-tab="by-dow" role="tab">Unplanned DT % by Day of Week</button>
        <button type="button" class="kpi-tab" data-tab="by-reason" role="tab">Unplanned DT % by Reason/ Period Trend</button>
      </div>

      <div id="kpi-tab-overview" class="kpi-tab-panel active" data-tab="overview" role="tabpanel"></div>
      <div id="kpi-tab-by-category" class="kpi-tab-panel" data-tab="by-category" role="tabpanel"></div>
      <div id="kpi-tab-by-line" class="kpi-tab-panel" data-tab="by-line" role="tabpanel"></div>
      <div id="kpi-tab-by-dow" class="kpi-tab-panel" data-tab="by-dow" role="tabpanel"></div>
      <div id="kpi-tab-by-reason" class="kpi-tab-panel" data-tab="by-reason" role="tabpanel"></div>
    </section>

    <!-- Insights -->
    <section id="page-insights" class="page-panel" aria-label="Insights">
      <div class="page-placeholder">
        <h2>Insights</h2>
        <p>AI-driven manufacturing insights — content coming in a future requirement.</p>
      </div>
    </section>

    <!-- Root Cause Analysis -->
    <section id="page-rca" class="page-panel" aria-label="Root Cause Analysis">
      <div class="page-placeholder">
        <h2>Root Cause Analysis</h2>
        <p>Deep-dive RCA workspace — content coming in a future requirement.</p>
      </div>
    </section>

  </main>

  <script src="{{ url_for('static', filename='js/console.js') }}"></script>
</body>
</html>
