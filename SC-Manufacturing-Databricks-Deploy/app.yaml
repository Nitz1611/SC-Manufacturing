# Databricks App configuration
# Docs: https://docs.databricks.com/en/dev-tools/databricks-apps/index.html
#
# 1. Copy this folder to /Workspace/Users/<your-email>/SC-Manufacturing
# 2. Set environment variables in the App UI (Secrets recommended for PAT)
# 3. Create App → point to this folder → Deploy

command:
  - npm
  - start

